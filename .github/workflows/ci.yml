name: Build and test
on:
  push:
    branches: [main, 'implementation/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/prepare-ux-baseline.mjs
      - run: node scripts/prepare-shell-baseline.mjs
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: ttropiano-web
          path: dist
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report
            test-results
          retention-days: 14
